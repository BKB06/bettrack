<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulte, filtre e liquide seu histórico de apostas esportivas.">
  <meta name="theme-color" content="#07090f">
  <title>BetTracker - Histórico</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <div id="auth-loading" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-body); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text);">
    <h2>Carregando...</h2>
  </div>
  <div id="login-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-body); z-index: 9998; display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--text);">
    <div style="font-size: 48px; margin-bottom: 16px;">🎯</div>
    <h1 style="margin-bottom: 8px;">BetTracker</h1>
    <p style="color: var(--muted); margin-bottom: 24px;">Faça login para acessar suas apostas na nuvem.</p>
    <button type="button" class="btn btn--primary" onclick="loginWithGoogle()" style="padding: 12px 24px; display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
      Entrar com Google
    </button>
  </div>

  <div class="app-wrapper" id="main-app-wrapper" style="display: none;">
    <div id="global-topbar"></div>
    <div class="app-body" id="app-body">
      <aside class="desktop-sidebar" id="global-sidebar"></aside>
      
      <main class="app-main desktop-main mobile-main" id="app-main">
      <div style="margin-bottom: 16px;">
        <p class="eyebrow">VISÃO GERAL</p>
        <h1 class="page-title">Histórico</h1>
      </div>

      <!-- KPIs -->
      <div class="mini-card-grid" style="grid-template-columns: repeat(2, 1fr);">
        <div class="mini-card mini-card--green">
          <div class="label">MAIOR ODD ACERTADA</div>
          <div class="value green" id="kpi-max-odd-win">-</div>
        </div>
        <div class="mini-card" style="border-color: var(--red-border);">
          <div class="label">MENOR ODD PERDIDA</div>
          <div class="value red" id="kpi-min-odd-loss">-</div>
        </div>
        <div class="mini-card">
          <div class="label">MAIOR LUCRO (APOSTA)</div>
          <div class="value green" id="kpi-max-profit">-</div>
        </div>
        <div class="mini-card">
          <div class="label">MAIOR PERDA (APOSTA)</div>
          <div class="value red" id="kpi-max-loss">-</div>
        </div>
      </div>

      <!-- Calendário (Mobile Only) -->
      <section class="card mobile-only" style="margin-bottom: 24px;">
        <div class="cal-nav">
          <button type="button" class="btn btn--icon" id="cal-prev" aria-label="Mês anterior" style="border-radius:var(--radius-lg); width:32px; height:32px;">‹</button>
          <div class="cal-nav__center">
            <div class="cal-nav__month" id="cal-month-name" style="font-size:16px;">Mai 2026</div>
            <div class="cal-nav__info" id="cal-month-info">Apostado: <span class="c-gold">R$ 0,00</span> · PnL: <span class="c-green">+R$ 0,00</span></div>
          </div>
          <button type="button" class="btn btn--icon" id="cal-next" aria-label="Próximo mês" style="border-radius:var(--radius-lg); width:32px; height:32px;">›</button>
        </div>
        <div class="cal-headers">
          <div class="cal-header-cell">D</div>
          <div class="cal-header-cell">S</div>
          <div class="cal-header-cell">T</div>
          <div class="cal-header-cell">Q</div>
          <div class="cal-header-cell">Q</div>
          <div class="cal-header-cell">S</div>
          <div class="cal-header-cell">S</div>
        </div>
        <div class="cal-grid" id="cal-grid">
          <!-- JS fills this -->
        </div>
      </section>

      <!-- Lista Completa -->
      <section>
        <div class="filter-bar" id="status-filter-bar">
          <button type="button" class="filter-btn" data-filter="all" aria-pressed="false">Todas</button>
          <button type="button" class="filter-btn active" data-filter="pending" aria-pressed="true">Abertas</button>
          <button type="button" class="filter-btn" data-filter="won" aria-pressed="false">Acertadas</button>
          <button type="button" class="filter-btn" data-filter="lost" aria-pressed="false">Erradas</button>
          <button type="button" class="filter-btn" data-filter="void" aria-pressed="false">Devolvidas</button>
        </div>
        <div class="filter-bar" id="sport-filter-bar" style="margin-top: 8px;">
          <button type="button" class="filter-btn active" data-sport="all" aria-pressed="true">Todos</button>
          <button type="button" class="filter-btn" data-sport="Basquete" aria-pressed="false">🏀 Basquete</button>
          <button type="button" class="filter-btn" data-sport="Futebol" aria-pressed="false">⚽ Futebol</button>
          <button type="button" class="filter-btn" data-sport="Outros" aria-pressed="false">🎯 Outros</button>
        </div>
        <div class="filter-bar" id="league-filter-bar" style="margin-top: 8px; display: none;">
          <button type="button" class="filter-btn active" data-league="all" aria-pressed="true">Todas</button>
          <button type="button" class="filter-btn" data-league="NBA" aria-pressed="false">NBA</button>
          <button type="button" class="filter-btn" data-league="WNBA" aria-pressed="false">WNBA</button>
        </div>
        <div id="all-bets-container"></div>
        <div id="pagination-container" class="pagination"></div>
      </section>

      </main>

      <aside class="desktop-right" id="global-right-panel"></aside>
    </div>
    <nav class="mobile-nav" id="global-mobile-nav" aria-label="Navegação móvel"></nav>
  </div>

  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-client.js"></script>

  <script src="core.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await window.authStateReady;
      document.getElementById('auth-loading').style.display = 'none';
      if (!user) {
        document.getElementById('login-screen').style.display = 'flex';
        return;
      }
      document.getElementById('main-app-wrapper').style.display = '';

      let db = await loadDb();
      let currentDate = new Date();
      let activeFilter = 'pending';
      let activeSportFilter = 'all';
      let activeLeagueFilter = 'all';
      let currentPageNum = 1;
      const activeActions = new Set();
      window.selectedDateFilter = null; // YYYY-MM-DD or null
      const ITEMS_PER_PAGE = 10;

      function renderKPIs() {
        let kpiBets = db.bets;
        if (activeSportFilter !== 'all') {
          kpiBets = kpiBets.filter(b => (b.sport || 'Outros') === activeSportFilter);
        }
        if (activeSportFilter === 'Basquete' && activeLeagueFilter !== 'all') {
          kpiBets = kpiBets.filter(b => b.league === activeLeagueFilter);
        }
        const wonBets = kpiBets.filter(b => b.status === 'won');
        const lostBets = kpiBets.filter(b => b.status === 'lost');

        const maxOddWin = wonBets.length ? Math.max(...wonBets.map(b => b.odd)) : 0;
        const minOddLoss = lostBets.length ? Math.min(...lostBets.map(b => b.odd)) : 0;
        const maxProfit = wonBets.length ? Math.max(...wonBets.map(b => b.profit)) : 0;
        const maxLoss = lostBets.length ? Math.max(...lostBets.map(b => b.stake)) : 0;

        document.getElementById('kpi-max-odd-win').textContent = maxOddWin ? maxOddWin.toFixed(2) : '-';
        document.getElementById('kpi-min-odd-loss').textContent = minOddLoss ? minOddLoss.toFixed(2) : '-';
        document.getElementById('kpi-max-profit').textContent = maxProfit ? formatMoney(maxProfit) : '-';
        document.getElementById('kpi-max-loss').textContent = maxLoss ? formatMoney(maxLoss) : '-';
      }

      async function resolveBet(betId, result) {
        if (!['won', 'lost', 'void'].includes(result) || activeActions.has(betId)) return;
        activeActions.add(betId);

        try {
          db = await loadDb();
          const betIndex = db.bets.findIndex(b => b.id === betId);
          if (betIndex === -1) return;

          const bet = db.bets[betIndex];
          if (bet.status !== 'pending') return;
          const bkIndex = db.bookmakers.findIndex(b => b.id === bet.bookmakerId);
          if (bkIndex === -1) {
            alert('A casa vinculada a esta aposta não foi encontrada.');
            return;
          }

          const settlement = calculateBetSettlement(bet, result);
          bet.profit = settlement.profit;
          bet.status = settlement.status;
          db.bookmakers[bkIndex].balance = roundMoney(
            db.bookmakers[bkIndex].balance + settlement.balanceCredit
          );
          await saveDb(db);
          refreshAll();
        } catch (error) {
          console.error('Erro ao liquidar aposta:', error);
        } finally {
          activeActions.delete(betId);
        }
      }

      async function revertBet(betId) {
        if (activeActions.has(betId)) return false;
        activeActions.add(betId);

        try {
          db = await loadDb();
          const betIndex = db.bets.findIndex(b => b.id === betId);
          if (betIndex === -1) return false;

          const bet = db.bets[betIndex];
          if (bet.status === 'pending') return true;
          const bkIndex = db.bookmakers.findIndex(b => b.id === bet.bookmakerId);

          if (bkIndex === -1) {
            alert('A casa vinculada a esta aposta não foi encontrada.');
            return false;
          }

          const debit = calculateBetReversalDebit(bet);
          const availableBalance = roundMoney(db.bookmakers[bkIndex].balance);
          if (debit > availableBalance + 0.0001) {
            alert(
              `Não é possível reverter: devolva ${formatMoney(debit - availableBalance)} ` +
              'ao saldo desta casa primeiro.'
            );
            return false;
          }

          db.bookmakers[bkIndex].balance = roundMoney(availableBalance - debit);

          bet.status = 'pending';
          bet.profit = 0;
          await saveDb(db);
          refreshAll();
          return true;
        } catch (error) {
          console.error('Erro ao reverter aposta:', error);
          return false;
        } finally {
          activeActions.delete(betId);
        }
      }

      window.resolveBet = resolveBet; // Expose to HTML inline onclick
      window.revertBet = revertBet;

      // Remove bet
      window.removeBet = async (id) => {
        const betIndex = db.bets.findIndex(b => b.id === id);
        if (betIndex === -1) return;
        const bet = db.bets[betIndex];

        let msg = 'Excluir aposta? O valor investido será devolvido à banca como se a aposta nunca tivesse existido.';
        if (bet.status === 'void') {
          msg = 'Excluir aposta Devolvida? Como o dinheiro já havia retornado para a banca, isso apenas apagará o registro do histórico sem alterar o seu saldo atual.';
        } else if (bet.status === 'won') {
          msg = 'Excluir aposta Ganha? O lucro obtido será removido do seu saldo e o valor investido voltará ao estado original (como se nunca tivesse apostado).';
        }

        if(confirm(msg)) {
          // Revert its status to pending first so we undo wins/losses
          const reverted = await revertBet(id);
          if (!reverted) return;
          
          // db has been updated by revertBet calling loadDb(), but let's be safe
          db = await loadDb();

          // Now it's pending. If it was not a freebet, refund the initial stake
          // We need to find the index again because revertBet saved/mutated db
          const updatedBetIndex = db.bets.findIndex(b => b.id === id);
          if (updatedBetIndex !== -1) {
            const updatedBet = db.bets[updatedBetIndex];
            const bkIndex = db.bookmakers.findIndex(b => b.id === updatedBet.bookmakerId);
            if (bkIndex !== -1 && !updatedBet.isFreebet) {
              db.bookmakers[bkIndex].balance = roundMoney(
                db.bookmakers[bkIndex].balance + updatedBet.stake
              );
            }
            
            // Finally delete it
            db.bets.splice(updatedBetIndex, 1);
            await saveDb(db);
            refreshAll();
          }
        }
      };

      function renderAllBets() {
        const container = document.getElementById('all-bets-container');
        let filtered = [...db.bets];
        
        if (activeFilter !== 'all') {
          filtered = filtered.filter(b => b.status === activeFilter);
        }

        // Sport filter
        if (activeSportFilter !== 'all') {
          filtered = filtered.filter(b => (b.sport || 'Outros') === activeSportFilter);
        }

        // League filter (only when sport is Basquete)
        if (activeSportFilter === 'Basquete' && activeLeagueFilter !== 'all') {
          filtered = filtered.filter(b => b.league === activeLeagueFilter);
        }

        // Filter by selected date from calendar
        if (window.selectedDateFilter) {
          filtered = filtered.filter(b => normalizeDate(b.date) === window.selectedDateFilter);
        }

        // Sort by date desc
        filtered.sort((a, b) => new Date(normalizeDate(b.date)) - new Date(normalizeDate(a.date)));

        if (filtered.length === 0) {
          container.innerHTML = '<p class="empty-state">Nenhuma aposta encontrada</p>';
          document.getElementById('pagination-container').innerHTML = '';
          renderDateFilterBanner();
          return;
        }

        const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
        if (currentPageNum > totalPages) {
          currentPageNum = totalPages;
        }
        if (currentPageNum < 1) {
          currentPageNum = 1;
        }

        const startIndex = (currentPageNum - 1) * ITEMS_PER_PAGE;
        const endIndex = startIndex + ITEMS_PER_PAGE;
        const paginatedBets = filtered.slice(startIndex, endIndex);

        container.innerHTML = paginatedBets.map(b => {
          const bk = db.bookmakers.find(bk => bk.id === b.bookmakerId);
          const safeId = escapeJsString(b.id);
          const event = escapeHtml(b.event);
          const sport = escapeHtml(b.sport || 'Outros');
          const bkName = escapeHtml(bk ? bk.name : 'Desconhecida');
          const bookmakerColor = sanitizeColor(bk?.color || '#4a5a7a');
          const formattedDate = escapeHtml(b.date.split('-').reverse().join('/'));
          let statusBadge, pnlClass, pnlText;

          const catClass = b.sport === 'Outros' ? 'tag--purple' : 'tag--blue';
          const sportLabel = b.sport === 'Basquete' ? '🏀' : b.sport === 'Futebol' ? '⚽' : '🎯';
          const leagueTag = b.league ? `<span class="tag tag--blue">${escapeHtml(b.league)}</span>` : '';

          if (b.status === 'pending') {
            const freebetTag = b.isFreebet ? '<span class="tag tag--gold" style="background:#ffb80044;">🎁 FREEBET</span>' : '';
            return `
              <div class="bet-card">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                  <div class="bet-card__title" style="margin-bottom: 0;">${event}</div>
                  <button type="button" class="bet-card__delete" onclick="removeBet('${safeId}')" title="Excluir aposta" aria-label="Excluir ${event}">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                  </button>
                </div>
                <div class="bet-card__tags" style="margin-bottom: 16px;">
                  <span class="tag tag--gold">⌛ ABERTA</span>
                  ${freebetTag}
                  <span class="tag ${catClass}">${sportLabel} ${sport}</span>
                    ${leagueTag}
                  <span class="tag" style="background: ${bookmakerColor}22; color: ${bookmakerColor};">${bkName}</span>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 16px;">
                  <div>Odd <strong style="color:var(--text); font-family:var(--mono);">${b.odd.toFixed(2)}</strong></div>
                  <div>Stake <strong style="color:var(--text); font-family:var(--mono);">${formatMoney(b.stake)}</strong></div>
                  <div style="font-family:var(--mono); font-size: 12px;">${formattedDate}</div>
                </div>

                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                  <button type="button" class="btn btn--win" style="flex: 1;" onclick="resolveBet('${safeId}', 'won')">✓ Acertou</button>
                  <button type="button" class="btn btn--lose" style="flex: 1;" onclick="resolveBet('${safeId}', 'lost')">✗ Errou</button>
                  <button type="button" class="btn btn--icon" style="width: 42px; height: 42px; border-radius: var(--radius-md);" onclick="resolveBet('${safeId}', 'void')" title="Aposta devolvida ou anulada" aria-label="Marcar como devolvida">∅</button>
                </div>
              </div>
            `;
          } else if (b.status === 'won') {
            statusBadge = '<span class="badge badge--won">Ganhou</span>';
            pnlClass = 'bet-card__pnl--pos';
            pnlText = '+' + formatMoney(b.profit);
          } else if (b.status === 'lost') {
            statusBadge = '<span class="badge badge--lost">Perdeu</span>';
            pnlClass = 'bet-card__pnl--neg';
            pnlText = '-' + formatMoney(Math.abs(b.profit));
          } else {
            statusBadge = '<span class="badge badge--void">Void</span>';
            pnlClass = '';
            pnlText = 'R$ 0,00';
          }
          
          const freebetTagResolved = b.isFreebet ? '<span class="badge" style="background:#ffb80044; color:#ffb800;">🎁 Freebet</span>' : '';

          return `
            <div class="bet-card">
              <div class="bet-card__header">
                <div class="bet-card__info">
                  <div class="bet-card__title">${event}</div>
                  <div class="bet-card__tags">
                    ${statusBadge}
                    ${freebetTagResolved}
                    <span class="tag ${catClass}">${sportLabel} ${sport}</span>
                    ${leagueTag}
                    <span class="tag tag--muted">${bkName}</span>
                    <span class="tag tag--muted">Odd ${b.odd.toFixed(2)}</span>
                  </div>
                </div>
                <div class="bet-card__pnl ${pnlClass}">
                  ${pnlText}
                </div>
              </div>
              <div class="bet-card__footer" style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div>
                  <span>Data: <strong>${formattedDate}</strong></span><br>
                  <span>Stake: <strong>${formatMoney(b.stake)}</strong></span>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button type="button" class="btn btn--secondary" style="padding: 4px 8px; font-size: 11px; height: auto;" onclick="revertBet('${safeId}')">↩ Desfazer</button>
                  <button type="button" class="bet-card__delete" onclick="removeBet('${safeId}')" title="Excluir aposta" aria-label="Excluir ${event}">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        renderPagination(totalPages);
        renderDateFilterBanner();
      }

      function renderPagination(totalPages) {
        const paginationContainer = document.getElementById('pagination-container');
        if (totalPages <= 1) {
          paginationContainer.innerHTML = '';
          return;
        }

        let html = '';
        for (let i = 1; i <= totalPages; i++) {
          const activeClass = i === currentPageNum ? 'active' : '';
          html += `<button type="button" class="pagination-btn ${activeClass}" onclick="goToPage(${i})" ${activeClass ? 'aria-current="page"' : ''}>${i}</button>`;
        }
        paginationContainer.innerHTML = html;
      }

      window.goToPage = function(page) {
        currentPageNum = page;
        renderAllBets();
        // Opcional: fazer scroll suave para o topo da lista
        document.getElementById('all-bets-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      // Filter events
        document.querySelectorAll('#status-filter-bar .filter-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
          document.querySelectorAll('#status-filter-bar .filter-btn').forEach(button => {
            button.classList.remove('active');
            button.setAttribute('aria-pressed', 'false');
          });
          e.currentTarget.classList.add('active');
          e.currentTarget.setAttribute('aria-pressed', 'true');
          activeFilter = e.currentTarget.dataset.filter;
          window.selectedDateFilter = null; // Clear date filter when changing status filter
          currentPageNum = 1;
          renderAllBets();
          renderCalendar(); // re-render to remove selection highlight
          updateGlobalUI(); // re-render global calendar
        });
      });

      // Sport filter events
        document.querySelectorAll('#sport-filter-bar .filter-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
          document.querySelectorAll('#sport-filter-bar .filter-btn').forEach(button => {
            button.classList.remove('active');
            button.setAttribute('aria-pressed', 'false');
          });
          e.currentTarget.classList.add('active');
          e.currentTarget.setAttribute('aria-pressed', 'true');
          activeSportFilter = e.currentTarget.dataset.sport;
          // Reset league filter
          activeLeagueFilter = 'all';
          document.querySelectorAll('#league-filter-bar .filter-btn').forEach(button => {
            button.classList.remove('active');
            button.setAttribute('aria-pressed', 'false');
          });
          const allLeagueBtn = document.querySelector('#league-filter-bar .filter-btn[data-league="all"]');
          if (allLeagueBtn) {
            allLeagueBtn.classList.add('active');
            allLeagueBtn.setAttribute('aria-pressed', 'true');
          }
          // Show/hide league filter bar
          document.getElementById('league-filter-bar').style.display = activeSportFilter === 'Basquete' ? '' : 'none';
          currentPageNum = 1;
          renderAllBets();
        });
      });

      // League filter events
        document.querySelectorAll('#league-filter-bar .filter-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
          document.querySelectorAll('#league-filter-bar .filter-btn').forEach(button => {
            button.classList.remove('active');
            button.setAttribute('aria-pressed', 'false');
          });
          e.currentTarget.classList.add('active');
          e.currentTarget.setAttribute('aria-pressed', 'true');
          activeLeagueFilter = e.currentTarget.dataset.league;
          currentPageNum = 1;
          renderAllBets();
        });
      });

      // Calendar logic
      function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const monthNames = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        document.getElementById('cal-month-name').textContent = `${monthNames[month]} ${year}`;

        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '';

        const firstDayIndex = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        let monthStaked = 0;
        let monthPnL = 0;

        // Group bets by date
        const dailyProfit = {};
        db.bets.filter(b => b.status !== 'pending').forEach(b => {
          const normDate = normalizeDate(b.date);
          const bDate = new Date(normDate + 'T12:00:00Z'); // avoid timezone shifts
          const bYear = bDate.getFullYear();
          const bMonth = bDate.getMonth();
          
          if (bYear === year && bMonth === month) {
            monthStaked += b.stake;
            monthPnL += b.profit;
          }

          if (!dailyProfit[normDate]) dailyProfit[normDate] = 0;
          dailyProfit[normDate] += b.profit;
        });

        // Update month info
        const pnlStr = monthPnL >= 0 ? `+${formatMoney(monthPnL)}` : `-${formatMoney(Math.abs(monthPnL))}`;
        const pnlColor = monthPnL >= 0 ? 'c-green' : 'c-red';
        document.getElementById('cal-month-info').innerHTML = `Apostado: <span class="c-gold">${formatMoney(monthStaked)}</span> · PnL: <span class="${pnlColor}">${pnlStr}</span>`;

        // Previous month padding
        for (let x = 0; x < firstDayIndex; x++) {
          grid.innerHTML += `<div class="cal-cell" style="border-color:transparent"></div>`;
        }

        // Days
        const todayStr = getLocalDateKey();

        for (let i = 1; i <= daysInMonth; i++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
          let cellClass = 'cal-cell';
          let pnlHtml = '';

          if (dateStr === todayStr) cellClass += ' cal-cell--today';

          if (dailyProfit[dateStr] !== undefined) {
            const pnl = dailyProfit[dateStr];
            if (pnl > 0) {
              cellClass += ' cal-cell--win';
              pnlHtml = `<div class="cal-cell__pnl">+${pnl.toFixed(0)}</div>`;
            } else if (pnl < 0) {
              cellClass += ' cal-cell--lose';
              pnlHtml = `<div class="cal-cell__pnl">${pnl.toFixed(0)}</div>`;
            } else {
               pnlHtml = `<div class="cal-cell__pnl" style="color:var(--muted)">0</div>`;
            }
          }

          const hasData = dailyProfit[dateStr] !== undefined;
          const selectedClass = window.selectedDateFilter === dateStr ? ' cal-cell--selected' : '';
          grid.innerHTML += hasData
            ? `<button type="button" class="${cellClass}${selectedClass}" data-date="${dateStr}" onclick="filterByDate('${dateStr}')" aria-label="Filtrar apostas de ${String(i).padStart(2, '0')}/${String(month + 1).padStart(2, '0')}/${year}">${i}${pnlHtml}</button>`
            : `<div class="${cellClass}${selectedClass}" aria-hidden="true">${i}${pnlHtml}</div>`;
        }
      }

      document.getElementById('cal-prev').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
      });

      document.getElementById('cal-next').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
      });

      function refreshAll() {
        renderKPIs();
        renderAllBets();
        renderCalendar();
        updateGlobalUI();
      }

      // Calendar day click handler
      window.filterByDate = function(dateStr) {
        if (window.selectedDateFilter === dateStr) {
          // Clicking the same date again clears the filter
          window.selectedDateFilter = null;
        } else {
          window.selectedDateFilter = dateStr;
          // Switch to 'all' status filter so user sees all bets for that day
          activeFilter = 'all';
          document.querySelectorAll('#status-filter-bar .filter-btn').forEach(button => {
            button.classList.remove('active');
            button.setAttribute('aria-pressed', 'false');
          });
          const allBtn = document.querySelector('#status-filter-bar .filter-btn[data-filter="all"]');
          if (allBtn) {
            allBtn.classList.add('active');
            allBtn.setAttribute('aria-pressed', 'true');
          }
        }
        currentPageNum = 1;
        renderAllBets();
        renderCalendar();
        updateGlobalUI(); // This updates the desktop global calendar visually
        // Scroll to the bets list
        document.getElementById('all-bets-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      window.clearDateFilter = function() {
        window.selectedDateFilter = null;
        currentPageNum = 1;
        renderAllBets();
        renderCalendar();
        updateGlobalUI();
      };

      function renderDateFilterBanner() {
        let banner = document.getElementById('date-filter-banner');
        if (!window.selectedDateFilter) {
          if (banner) banner.remove();
          return;
        }
        const formattedDate = window.selectedDateFilter.split('-').reverse().join('/');
        const bannerHtml = `<div class="date-filter-banner" id="date-filter-banner">
          <span>📅 Mostrando apostas de<strong>${formattedDate}</strong></span>
          <button type="button" onclick="clearDateFilter()" title="Limpar filtro" aria-label="Limpar filtro de data">✕</button>
        </div>`;
        const container = document.getElementById('all-bets-container');
        if (banner) {
          banner.outerHTML = bannerHtml;
        } else {
          container.insertAdjacentHTML('beforebegin', bannerHtml);
        }
      }

      // Read ?date= query parameter from URL (e.g. from dashboard calendar click)
      const urlParams = new URLSearchParams(window.location.search);
      const dateParam = urlParams.get('date');
      if (dateParam && /^\d{4}-\d{2}-\d{2}$/.test(dateParam)) {
        window.selectedDateFilter = dateParam;
        activeFilter = 'all';
        document.querySelectorAll('#status-filter-bar .filter-btn').forEach(button => {
          button.classList.remove('active');
          button.setAttribute('aria-pressed', 'false');
        });
        const allBtn = document.querySelector('#status-filter-bar .filter-btn[data-filter="all"]');
        if (allBtn) {
          allBtn.classList.add('active');
          allBtn.setAttribute('aria-pressed', 'true');
        }
        // Navigate calendar to the correct month
        const [y, m] = dateParam.split('-').map(Number);
        currentDate = new Date(y, m - 1, 1);
        // Clean URL without reload
        history.replaceState(null, '', window.location.pathname);
      }

      refreshAll();
    });
  </script>
</body>
</html>
