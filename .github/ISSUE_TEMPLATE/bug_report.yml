name: Relatar um problema
description: Informe um comportamento inesperado e como reproduzi-lo.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Não inclua dados pessoais, saldos reais ou credenciais. Vulnerabilidades devem seguir o SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o resultado observado e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
      placeholder: "1. Abra...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador e dispositivo
      placeholder: Chrome 128, Android 15
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Removi dados pessoais e credenciais do relato.
          required: true
