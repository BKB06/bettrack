<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre suas casas de aposta e acompanhe o saldo disponível em cada conta.">
  <meta name="theme-color" content="#07090f">
  <title>BetTracker - Casas de Aposta</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <div id="auth-loading" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-body); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text);">
    <h2>Carregando...</h2>
  </div>
  <div id="login-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-body); z-index: 9998; display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--text);">
    <div style="font-size: 48px; margin-bottom: 16px;">🎯</div>
    <h1 style="margin-bottom: 8px;">BetTracker</h1>
    <p style="color: var(--muted); margin-bottom: 24px;">Faça login para acessar suas apostas na nuvem.</p>
    <button type="button" class="btn btn--primary" onclick="loginWithGoogle()" style="padding: 12px 24px; display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
      Entrar com Google
    </button>
  </div>

  <div class="app-wrapper" id="main-app-wrapper" style="display: none;">
    <div id="global-topbar"></div>
    <div class="app-body" id="app-body">
      <aside class="desktop-sidebar" id="global-sidebar"></aside>
      
      <main class="app-main desktop-main mobile-main" id="app-main">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;">
        <div>
          <p class="eyebrow">PORTFÓLIO</p>
          <h1 class="page-title">Casas de Aposta</h1>
        </div>
        <button class="btn btn--subtle btn--sm" id="btn-add-bk">+ Adicionar</button>
      </div>

      <!-- Add Bookmaker Form (Hidden by default) -->
      <form id="add-bk-form" class="card" style="display:none; margin-bottom: 24px;">
        <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 16px;">Nova Casa</h2>
        <div class="field">
          <label class="field-label" for="new-bk-name">NOME</label>
          <input type="text" class="input" id="new-bk-name" placeholder="Ex: KTO, Pinnacle..." maxlength="80" autocomplete="organization" required>
        </div>
        <div class="field">
          <span class="field-label" id="color-picker-label">COR</span>
          <div class="color-picker" id="color-picker">
            <button type="button" class="color-swatch active" style="background: #ff3c3c" data-color="#ff3c3c" aria-label="Vermelho" aria-pressed="true"></button>
            <button type="button" class="color-swatch" style="background: #ff8a00" data-color="#ff8a00" aria-label="Laranja" aria-pressed="false"></button>
            <button type="button" class="color-swatch" style="background: #4da8ff" data-color="#4da8ff" aria-label="Azul" aria-pressed="false"></button>
            <button type="button" class="color-swatch" style="background: #a78bfa" data-color="#a78bfa" aria-label="Roxo" aria-pressed="false"></button>
            <button type="button" class="color-swatch" style="background: #00d2ff" data-color="#00d2ff" aria-label="Ciano" aria-pressed="false"></button>
            <button type="button" class="color-swatch" style="background: #ff5e3a" data-color="#ff5e3a" aria-label="Coral" aria-pressed="false"></button>
            <button type="button" class="color-swatch" style="background: #6ab04c" data-color="#6ab04c" aria-label="Verde oliva" aria-pressed="false"></button>
            <button type="button" class="color-swatch" style="background: #636e72" data-color="#636e72" aria-label="Cinza" aria-pressed="false"></button>
            <button type="button" class="color-swatch" style="background: #ffb800" data-color="#ffb800" aria-label="Amarelo" aria-pressed="false"></button>
            <button type="button" class="color-swatch" style="background: #00e87a" data-color="#00e87a" aria-label="Verde" aria-pressed="false"></button>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--full" style="margin-top: 8px;">Adicionar</button>
      </form>

      <!-- Totals -->
      <div class="mini-card-grid">
        <div class="mini-card">
          <div class="label">Total Esportivo</div>
          <div class="value green" id="total-sports">R$ 0,00</div>
        </div>
        <div class="mini-card" style="display:none;">
          <div class="label">Total Outros</div>
          <div class="value blue" id="total-casino">R$ 0,00</div>
        </div>
        <div class="mini-card">
          <div class="label">Exposto</div>
          <div class="value gold" id="total-exposed">R$ 0,00</div>
        </div>
      </div>

      <!-- Bookmakers List -->
      <div id="bookmakers-list"></div>

      </main>

      <aside class="desktop-right" id="global-right-panel"></aside>
    </div>
    <nav class="mobile-nav" id="global-mobile-nav" aria-label="Navegação móvel"></nav>
  </div>

  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-client.js"></script>

  <script src="core.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await window.authStateReady;
      document.getElementById('auth-loading').style.display = 'none';
      if (!user) {
        document.getElementById('login-screen').style.display = 'flex';
        return;
      }
      document.getElementById('main-app-wrapper').style.display = '';

      let db = await loadDb();
      let selectedColor = '#ff3c3c';

      const formWrap = document.getElementById('add-bk-form');
      const btnAdd = document.getElementById('btn-add-bk');

      btnAdd.addEventListener('click', () => { formWrap.style.display = 'block'; });

      document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.addEventListener('click', (e) => {
          document.querySelectorAll('.color-swatch').forEach(s => {
            s.classList.remove('active');
            s.setAttribute('aria-pressed', 'false');
          });
          e.target.classList.add('active');
          e.target.setAttribute('aria-pressed', 'true');
          selectedColor = e.target.dataset.color;
        });
      });

      formWrap.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('new-bk-name').value.trim();
        if (!name) return;

        db.bookmakers.push({
          id: generateId(),
          name,
          color: selectedColor,
          balance: 0
        });
        
        await saveDb(db);
        formWrap.reset();
        formWrap.style.display = 'none';
        refreshAll();
      });

      window.removeBookmaker = async (id) => {
        db = await loadDb();
        const bookmaker = db.bookmakers.find(item => item.id === id);
        if (!bookmaker) return;

        const hasBalance = Number(bookmaker.balance) > 0;
        const hasBets = db.bets.some(bet => bet.bookmakerId === id);
        const hasCashflow = db.cashflow.some(entry => entry.fromBook === id || entry.toBook === id);
        if (hasBalance || hasBets || hasCashflow) {
          alert('Esta casa possui saldo ou histórico relacionado e não pode ser excluída. Zere o saldo e preserve os registros para manter os relatórios corretos.');
          return;
        }

        if (!confirm(`Apagar a casa "${bookmaker.name}"?`)) return;
        db.bookmakers = db.bookmakers.filter(item => item.id !== id);
        await saveDb(db);
        refreshAll();
      };

      window.updateBalance = async (id, type, value) => {
        db = await loadDb();
        const bk = db.bookmakers.find(b => b.id === id);
        if (bk) {
          const parsedValue = Number(value);
          if (!Number.isFinite(parsedValue) || parsedValue < 0) {
            alert('Informe um saldo válido, maior ou igual a zero.');
            return;
          }
          bk[type] = parsedValue;
          await saveDb(db);
          renderTotals(); // Just update totals without re-rendering everything to keep focus
        }
      };

      window.previewUrl = (id, name, value, inputEl) => {
        if (inputEl) {
          const card = inputEl.closest('.bookmaker-card');
          if (card) {
            const link = card.querySelector('.external-link-btn');
            if (link) {
              const url = normalizeExternalUrl(value);
              link.href = url || getDefaultBookmakerUrl(name);
            }
          }
        }
      };

      window.updateUrl = async (id, value, inputEl) => {
        db = await loadDb();
        const bk = db.bookmakers.find(b => b.id === id);
        if (bk) {
          const rawUrl = value ? value.trim() : '';
          const url = normalizeExternalUrl(rawUrl);
          if (rawUrl && !url) {
            alert('Informe um endereço válido, como exemplo.com.');
            return;
          }
          bk.url = url;
          await saveDb(db);
          // Atualiza o link e o input no DOM para refletir a alteração instantaneamente
          if (inputEl) {
            const card = inputEl.closest('.bookmaker-card');
            if (card) {
              const link = card.querySelector('.external-link-btn');
              const finalUrl = url || getDefaultBookmakerUrl(bk.name);
              if (link) {
                link.href = finalUrl;
              }
              inputEl.value = finalUrl.replace(/^https?:\/\/(www\.)?/, '');
            }
          }
        }
      };

      function renderTotals() {
        const tSports = db.bookmakers.reduce((sum, bk) => sum + Number(bk.balance !== undefined ? bk.balance : (bk.sportsBalance || 0)), 0);
        const tExposed = calculateExposed(db);

        document.getElementById('total-sports').textContent = formatMoney(tSports);
        document.getElementById('total-exposed').textContent = formatMoney(tExposed);
      }

      function renderList() {
        const list = document.getElementById('bookmakers-list');
        const sorted = db.bookmakers.slice().sort((a, b) => {
          const totalA = Number(a.balance !== undefined ? a.balance : (a.sportsBalance || 0));
          const totalB = Number(b.balance !== undefined ? b.balance : (b.sportsBalance || 0));
          return totalB - totalA;
        });

        list.innerHTML = sorted.map(bk => {
          const total = Number(bk.balance !== undefined ? bk.balance : (bk.sportsBalance || 0));
          
          const bkExposed = db.bets
            .filter(b => b.status === 'pending' && b.bookmakerId === bk.id)
            .reduce((sum, b) => sum + Number(b.stake), 0);

          let exposedHtml = `
            <div class="bookmaker-exposed" ${bkExposed === 0 ? 'style="visibility: hidden;"' : ''}>
              <span class="bookmaker-exposed__label">VALOR EXPOSTO</span>
              <span class="bookmaker-exposed__value">${formatMoney(bkExposed)}</span>
            </div>
          `;

          const isActive = total >= 0.01;
          const statusColor = isActive ? 'var(--green)' : 'var(--muted)';
          const safeId = escapeJsString(bk.id);
          const safeName = escapeHtml(bk.name);
          const safeNameForHandler = escapeJsString(bk.name);
          const initial = escapeHtml(bk.name.charAt(0).toUpperCase());
          const color = sanitizeColor(bk.color);
          const bookmakerUrl = normalizeExternalUrl(bk.url) || getDefaultBookmakerUrl(bk.name);
          const safeUrl = escapeHtml(bookmakerUrl);
          const displayUrl = escapeHtml(bookmakerUrl.replace(/^https?:\/\/(www\.)?/, ''));

          return `
            <div class="bookmaker-card">
              <div class="bookmaker-card__header">
                <div class="bookmaker-logo" style="background: rgba(255,255,255,0.05); color: ${color}">
                  ${initial}
                </div>
                <div class="bookmaker-title-wrapper">
                  <div class="bookmaker-name">${safeName}</div>
                  <div class="bookmaker-status">
                    <div class="status-dot" style="background: ${statusColor}"></div>
                    ${isActive ? 'ativo' : 'inativo'}
                  </div>
                </div>
                <button type="button" class="bookmaker-remove" onclick="removeBookmaker('${safeId}')" title="Remover casa" aria-label="Remover ${safeName}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              
              <div class="bookmaker-card__divider"></div>
              
              <div class="bookmaker-card__body">
                <div class="label" style="font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 700;">SALDO</div>
                <div style="display: flex; align-items: baseline; gap: 4px; margin-bottom: 16px;">
                  <span style="color: ${statusColor}; font-size: 15px; font-weight: 800; font-family: var(--mono);">R$</span>
                  <input type="number" min="0" step="0.01" inputmode="decimal" aria-label="Saldo de ${safeName}" class="bookmaker-balance-input" style="color: ${statusColor};" value="${total.toFixed(2)}" onchange="updateBalance('${safeId}', 'balance', this.value); renderTotals();">
                </div>
                
                <div class="bookmaker-url-row">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                  <input type="url" class="url-input-clean" aria-label="Site de ${safeName}" value="${displayUrl}" onchange="updateUrl('${safeId}', this.value, this)" oninput="previewUrl('${safeId}', '${safeNameForHandler}', this.value, this)" placeholder="dominio.com">
                  <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="external-link-btn" title="Acessar site" aria-label="Abrir site de ${safeName}" onclick="autoCheckin('${safeId}')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                  </a>
                </div>
              </div>
              
              ${exposedHtml}
            </div>
          `;
        }).join('');
      }

      function refreshAll() {
        renderTotals();
        renderList();
        updateGlobalUI();
      }

      window.autoCheckin = async (id) => {
        db = await loadDb();
        if (!db.dailyLogins.logins[id]) {
          markLogin(db, id);
          await saveDb(db);
        }
      };

      refreshAll();
    });
  </script>
</body>
</html>
