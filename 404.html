<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07090f">
  <title>Página não encontrada — BetTracker</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .not-found__card {
      width: min(100%, 520px);
      text-align: center;
      padding: 40px 28px;
    }

    .not-found__code {
      color: var(--green);
      font: 800 64px/1 var(--mono);
      margin-bottom: 16px;
    }

    .not-found__text {
      color: var(--muted);
      margin: 12px auto 24px;
      max-width: 38ch;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <section class="card not-found__card" aria-labelledby="not-found-title">
      <p class="not-found__code" aria-hidden="true">404</p>
      <h1 class="page-title" id="not-found-title">Página não encontrada</h1>
      <p class="not-found__text">O endereço pode estar incorreto ou a página pode ter sido movida.</p>
      <a class="btn btn--primary" href="index.html">Voltar ao BetTracker</a>
    </section>
  </main>
</body>
</html>
