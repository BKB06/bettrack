<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registre depósitos, saques e transferências entre suas casas de aposta.">
  <meta name="theme-color" content="#07090f">
  <title>BetTracker - Fundos</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <div id="auth-loading" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-body); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text);">
    <h2>Carregando...</h2>
  </div>
  <div id="login-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-body); z-index: 9998; display: none; flex-direction: column; justify-content: center; align-items: center; color: var(--text);">
    <div style="font-size: 48px; margin-bottom: 16px;">🎯</div>
    <h1 style="margin-bottom: 8px;">BetTracker</h1>
    <p style="color: var(--muted); margin-bottom: 24px;">Faça login para acessar suas apostas na nuvem.</p>
    <button type="button" class="btn btn--primary" onclick="loginWithGoogle()" style="padding: 12px 24px; display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
      Entrar com Google
    </button>
  </div>

  <div class="app-wrapper" id="main-app-wrapper" style="display: none;">
    <div id="global-topbar"></div>
    <div class="app-body" id="app-body">
      <aside class="desktop-sidebar" id="global-sidebar"></aside>
      
      <main class="app-main desktop-main mobile-main" id="app-main">
      <div style="margin-bottom: 24px;">
        <p class="eyebrow">MOVIMENTAÇÕES</p>
        <h1 class="page-title" id="page-title">Transferência</h1>
      </div>

      <!-- Mercado Pago Card -->
      <button type="button" class="bank-card bank-card--button" id="mp-card" onclick="editMpBalance()">
        <span style="display: flex; justify-content: space-between; align-items: flex-start;">
          <span class="bank-card__label" style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:14px;">🏦</span> MERCADO PAGO
          </span>
          <span class="bank-card__hint" style="color: var(--blue);">toque para editar</span>
        </span>
        <span class="bank-card__value" id="mp-balance-display">R$ 0,00</span>
      </button>

      <div class="card" style="margin-bottom: 32px;">
        <!-- Tabs -->
        <div class="transfer-tabs">
          <button type="button" class="transfer-tab" data-type="deposit" aria-pressed="false">
            <span style="display:block; margin-bottom:4px; font-size:16px;">↓</span>
            Depósito
          </button>
          <button type="button" class="transfer-tab active" data-type="withdraw" aria-pressed="true">
            <span style="display:block; margin-bottom:4px; font-size:16px;">↑</span>
            Saque
          </button>
          <button type="button" class="transfer-tab" data-type="transfer" aria-pressed="false">
            <span style="display:block; margin-bottom:4px; font-size:16px;">⇄</span>
            Entre Casas
          </button>
        </div>

        <!-- Form -->
        <form id="cashflow-form">
          <p id="form-direction" style="font-size:12px; color:var(--muted); margin-bottom:12px;">Casa de Apostas → Mercado Pago</p>
          
          <div class="field" id="field-book-from">
            <label class="field-label" id="label-book-from" for="input-book-from">Casa de Origem</label>
            <select class="select" id="input-book-from" required></select>
          </div>

          <div class="field" id="field-book-to" style="display: none;">
            <label class="field-label" for="input-book-to">Casa de Destino</label>
            <select class="select" id="input-book-to"></select>
          </div>

          <div class="field-grid-2">
            <div class="field">
              <label class="field-label" for="input-amount">Valor (R$)</label>
              <input type="number" min="0.01" max="999999999.99" step="0.01" inputmode="decimal" class="input" id="input-amount" placeholder="0.00" required>
            </div>
            <div class="field">
              <label class="field-label" for="input-date">Data</label>
              <input type="date" class="input" id="input-date" required>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="input-note">Observação (Opcional)</label>
            <input type="text" class="input" id="input-note" maxlength="240" placeholder="Ex: lucro semanal">
          </div>

          <button type="submit" class="btn btn--primary btn--full" id="btn-submit" style="margin-top: 8px;">
            Registrar Saque
          </button>
        </form>
      </div>

      <!-- History -->
      <div>
        <h2 class="sidebar-section-label" style="padding:0">Histórico</h2>
        <div id="cashflow-list"></div>
      </div>

      </main>

      <aside class="desktop-right" id="global-right-panel"></aside>
    </div>
    <nav class="mobile-nav" id="global-mobile-nav" aria-label="Navegação móvel"></nav>
  </div>

  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-client.js"></script>

  <script src="core.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await window.authStateReady;
      document.getElementById('auth-loading').style.display = 'none';
      if (!user) {
        document.getElementById('login-screen').style.display = 'flex';
        return;
      }
      document.getElementById('main-app-wrapper').style.display = '';

      let db = await loadDb();
      let currentType = 'withdraw';
      
      const mpBalance = document.getElementById('mp-balance');
      const tabs = document.querySelectorAll('.transfer-tab');
      const form = document.getElementById('cashflow-form');
      const directionLabel = document.getElementById('form-direction');
      const fieldBookTo = document.getElementById('field-book-to');
      const inputBookFrom = document.getElementById('input-book-from');
      const inputBookTo = document.getElementById('input-book-to');
      const labelBookFrom = document.getElementById('label-book-from');
      const btnSubmit = document.getElementById('btn-submit');
      const pageTitle = document.getElementById('page-title');

      // Initialize defaults
      document.getElementById('input-date').valueAsDate = new Date();
      updateMpDisplay();

      // Mercado Pago editing
      window.editMpBalance = async () => {
        db = await loadDb();
        const novoSaldo = prompt("Digite o novo saldo do Mercado Pago:", db.mercadoPago.toFixed(2));
        if (novoSaldo !== null) {
          const parsed = parseFloat(novoSaldo.replace(',', '.'));
          if (Number.isFinite(parsed) && parsed >= 0) {
            db.mercadoPago = parsed;
            await saveDb(db);
            updateMpDisplay();
            updateGlobalUI();
          } else {
            alert('Informe um saldo válido, maior ou igual a zero.');
          }
        }
      };

      function updateMpDisplay() {
        document.getElementById('mp-balance-display').textContent = formatMoney(db.mercadoPago);
      }

      function populateSelects() {
        const allOptions = db.bookmakers.map(bk =>
          `<option value="${escapeHtml(bk.id)}">${escapeHtml(bk.name)} (R$ ${Number(bk.balance || 0).toFixed(2)})</option>`
        ).join('');

        // Saques e transferências só podem começar em contas com saldo disponível.
        const needsBalance = (currentType === 'withdraw' || currentType === 'transfer');
        const withBalance = db.bookmakers.filter(bk => Number(bk.balance || 0) > 0);
        const fromOptions = needsBalance
          ? (withBalance.length > 0
              ? withBalance.map(bk =>
                  `<option value="${escapeHtml(bk.id)}">${escapeHtml(bk.name)} (R$ ${Number(bk.balance || 0).toFixed(2)})</option>`
                ).join('')
              : '<option value="" disabled selected>Nenhuma casa com saldo</option>')
          : allOptions;
        
        const prevFrom = inputBookFrom.value;
        const prevTo = inputBookTo.value;

        inputBookFrom.innerHTML = fromOptions;
        inputBookTo.innerHTML = allOptions;

        if (prevFrom && Array.from(inputBookFrom.options).some(option => option.value === prevFrom)) {
          inputBookFrom.value = prevFrom;
        }
        if (prevTo && Array.from(inputBookTo.options).some(option => option.value === prevTo)) {
          inputBookTo.value = prevTo;
        }
      }

      function updateMode() {
        tabs.forEach(tab => {
          const isActive = tab.dataset.type === currentType;
          tab.classList.toggle('active', isActive);
          tab.setAttribute('aria-pressed', String(isActive));
        });

        if (currentType === 'deposit') {
          directionLabel.textContent = 'Mercado Pago → Casa de Apostas';
          labelBookFrom.textContent = 'Casa de Destino';
          fieldBookTo.style.display = 'none';
          inputBookTo.removeAttribute('required');
          btnSubmit.textContent = 'Registrar Depósito';
        } else if (currentType === 'withdraw') {
          directionLabel.textContent = 'Casa de Apostas → Mercado Pago';
          labelBookFrom.textContent = 'Casa de Origem';
          fieldBookTo.style.display = 'none';
          inputBookTo.removeAttribute('required');
          btnSubmit.textContent = 'Registrar Saque';
        } else {
          directionLabel.textContent = 'Entre Casas de Aposta';
          labelBookFrom.textContent = 'Casa de Origem';
          fieldBookTo.style.display = 'block';
          inputBookTo.setAttribute('required', 'true');
          btnSubmit.textContent = 'Registrar Transferência';
        }
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
          currentType = e.currentTarget.dataset.type;
          populateSelects();
          updateMode();
        });
      });

      function renderHistory() {
        const container = document.getElementById('cashflow-list');
        if (!db.cashflow || db.cashflow.length === 0) {
          container.innerHTML = '<p class="empty-state">Nenhuma movimentação</p>';
          return;
        }

        const sorted = [...db.cashflow].sort((a,b) => new Date(b.date) - new Date(a.date));
        
        container.innerHTML = sorted.map(c => {
          let label, typeClass, sign, fromTo;
          const bkFrom = db.bookmakers.find(b => b.id === c.fromBook)?.name || 'Desconhecida';
          
          if (c.type === 'deposit') {
            label = 'Depósito';
            typeClass = 'transfer-item--deposit';
            sign = '+';
            fromTo = `Para ${bkFrom}`;
          } else if (c.type === 'withdraw') {
            label = 'Saque';
            typeClass = 'transfer-item--withdrawal';
            sign = '-';
            fromTo = `De ${bkFrom}`;
          } else {
            const bkTo = db.bookmakers.find(b => b.id === c.toBook)?.name || 'Desconhecida';
            label = 'Transferência';
            typeClass = 'transfer-item--transfer';
            sign = '';
            fromTo = `${bkFrom} → ${bkTo}`;
          }

          return `
            <div class="transfer-item ${typeClass}">
              <div>
                <div class="transfer-item__label">${label}</div>
                <div class="transfer-item__meta">${escapeHtml(c.date.split('-').reverse().join('/'))} • ${escapeHtml(fromTo)}</div>
                ${c.note ? `<div class="transfer-item__meta" style="color:var(--text)">${escapeHtml(c.note)}</div>` : ''}
              </div>
              <div class="transfer-item__amount">${sign}${formatMoney(c.amount)}</div>
            </div>
          `;
        }).join('');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (btnSubmit.disabled) return;

        const originalButtonText = btnSubmit.textContent;
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Salvando...';

        try {
          const amountString = document.getElementById('input-amount').value;
          const amount = parseFloat(amountString.replace(',', '.'));
          const bkFromId = inputBookFrom.value;
          const bkToId = inputBookTo.value;

          if (!Number.isFinite(amount) || amount <= 0) {
            alert('Por favor, informe um valor válido.');
            return;
          }

          db = await loadDb(); // Reduz o risco de operar sobre um snapshot antigo.

          const idxFrom = db.bookmakers.findIndex(b => b.id === bkFromId);
          const idxTo = db.bookmakers.findIndex(b => b.id === bkToId);
          if (idxFrom < 0 || (currentType === 'transfer' && idxTo < 0)) {
            alert('Selecione casas de aposta válidas.');
            return;
          }

          if (currentType === 'deposit') {
            if (parseFloat(db.mercadoPago.toFixed(2)) < amount) {
              alert('Saldo do Mercado Pago insuficiente.');
              return;
            }
            db.mercadoPago -= amount;
            db.mercadoPago = Math.max(0, parseFloat(db.mercadoPago.toFixed(2)));
            db.bookmakers[idxFrom].balance += amount;
            db.bookmakers[idxFrom].balance = parseFloat(db.bookmakers[idxFrom].balance.toFixed(2));
          } else if (currentType === 'withdraw') {
            if (parseFloat(db.bookmakers[idxFrom].balance.toFixed(2)) < amount) {
              alert('Saldo na Casa de Apostas insuficiente.');
              return;
            }
            db.bookmakers[idxFrom].balance -= amount;
            db.bookmakers[idxFrom].balance = Math.max(0, parseFloat(db.bookmakers[idxFrom].balance.toFixed(2)));
            db.mercadoPago += amount;
            db.mercadoPago = parseFloat(db.mercadoPago.toFixed(2));
          } else if (currentType === 'transfer') {
            if (bkFromId === bkToId) {
              alert('Origem e destino devem ser diferentes.');
              return;
            }
            if (parseFloat(db.bookmakers[idxFrom].balance.toFixed(2)) < amount) {
              alert('Saldo na Casa de Origem insuficiente.');
              return;
            }
            db.bookmakers[idxFrom].balance -= amount;
            db.bookmakers[idxFrom].balance = Math.max(0, parseFloat(db.bookmakers[idxFrom].balance.toFixed(2)));
            db.bookmakers[idxTo].balance += amount;
            db.bookmakers[idxTo].balance = parseFloat(db.bookmakers[idxTo].balance.toFixed(2));
          }

          db.cashflow = db.cashflow || [];
          db.cashflow.push({
            id: generateId(),
            date: document.getElementById('input-date').value,
            type: currentType,
            amount,
            fromBook: bkFromId,
            toBook: currentType === 'transfer' ? bkToId : null,
            note: document.getElementById('input-note').value.trim()
          });

          await saveDb(db);
          alert('Movimentação salva com sucesso!');
          form.reset();
          document.getElementById('input-date').valueAsDate = new Date();
          updateMpDisplay();
          updateGlobalUI();
          populateSelects();
          renderHistory();
        } catch (error) {
          console.error('Erro ao registrar movimentação:', error);
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = originalButtonText;
        }
      });

      // Init
      populateSelects();
      updateMode();
      renderHistory();
    });
  </script>
</body>
</html>
